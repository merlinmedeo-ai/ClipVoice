name: Build

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ClipVoice.csproj

      - name: Build
        run: dotnet build ClipVoice.csproj --configuration Release --no-restore

      - name: Publish self-contained app
        run: >-
          dotnet publish ClipVoice.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/ClipVoice-win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVoice-win-x64
          path: artifacts/ClipVoice-win-x64/ClipVoice.exe
          if-no-files-found: error
