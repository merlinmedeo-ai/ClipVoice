name: Bug report
description: Report a reproducible issue in ClipVoice
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include clipboard contents, private templates, tokens, or other sensitive data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClipVoice version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redacted log excerpts are welcome, but do not include user text or secrets.
